# Every push to main checks the code, applies new D1 migrations and deploys the Worker.
# Repo secrets: CLOUDFLARE_API_TOKEN, CLOUDFLARE_ACCOUNT_ID, APP_SECRET (see README > Deploy).
name: Deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

# One deploy at a time; a newer push waits instead of cancelling a migration halfway.
concurrency:
  group: deploy-production
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 26
          cache: npm

      - run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Test
        run: npm test

      - name: Find or create the D1 database
        run: node scripts/ensure-d1.mjs

      - name: Build
        run: npm run build

      - name: Apply D1 migrations
        run: npx wrangler d1 migrations apply simple-mailbox-db --remote

      - name: Deploy
        run: npx wrangler deploy

      - name: Set APP_SECRET on the Worker
        env:
          APP_SECRET: ${{ secrets.APP_SECRET }}
        run: |
          test -n "$APP_SECRET" || { echo "APP_SECRET repo secret is missing"; exit 1; }
          printf '%s' "$APP_SECRET" | npx wrangler secret put APP_SECRET

      - name: Check the site answers
        run: curl -fsS --retry 10 --retry-delay 3 --retry-all-errors https://bmail.beenex.company/api/state
